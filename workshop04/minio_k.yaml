---
apiVersion: v1
kind: Namespace
metadata:
  name: minio-ns
  labels:
    app: minio

---
apiVersion: v1
kind: Service
metadata:
  name: minio-hsvc
  namespace: minio-ns
  labels:
    app: minio
spec:
  clusterIP: None
  selector:
    app: minio-po
  ports:
    - port: 9000
      name: http
      targetPort: 9000
    - port: 9001
      name: console
      targetPort: 9001

---
apiVersion: v1
kind: Service
metadata:
  name: minio-svc
  namespace: minio-ns
  labels:
    app: minio
spec:
  selector:
    app: minio-po
  ports:
    - port: 9000
      name: http
      targetPort: 9000
    - port: 9001
      name: console
      targetPort: 9001

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio-sts
  namespace: minio-ns
  labels:
    app: minio
spec:
  replicas: 3
  serviceName: "minio-hsvc"
  selector:
    matchLabels:
      app: minio-po
  template:
    metadata:
      labels:
        app: minio-po
    spec:
      securityContext:
        fsGroup: 1001
      containers:
        - name: minio
          image: minio/minio:latest
          ports:
            - containerPort: 9000
              name: http
            - containerPort: 9001
              name: console
          env:
            - name: MINIO_ROOT_USER
              value: "minioadmin"
            - name: MINIO_ROOT_PASSWORD
              value: "minioadmin"
          args:
            - server
            - --console-address
            - ":9001"
            - --address
            - ":9000"
            - http://minio-sts-{0...2}.minio-hsvc.minio-ns.svc.cluster.local/data
          resources:
            requests:
              memory: 250Mi
              cpu: 200m
            limits:
              memory: 250Mi
              cpu: 200m
          volumeMounts:
            - name: minio-volume
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: minio-volume
      spec:
        storageClassName: do-block-storage
        accessModes: ["ReadWriteOncePod"]
        resources:
          requests:
            storage: 1Gi

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: minio-hpa
  namespace: minio-ns
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: minio-sts
  minReplicas: 3
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: minio-ing
  namespace: minio-ns
spec:
  ingressClassName: nginx
  rules:
    - host: console.139.59.195.104.sslip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: minio-svc
                port:
                  number: 9001
    - host: data.139.59.195.104.sslip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: minio-svc
                port:
                  number: 9000
