---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bggapp-deploy
  namespace: bggns

spec:
  replicas: 3
  selector:
    matchLabels:
      app: bggapp
      name: bggapp-po
  template:
    metadata:
      labels:
        name: bggapp-po
        app: bggapp
      namespace: bggns
    spec:
      containers:
        - name: bggapp
          image: chukmunnlee/bgg-app:nov-2025
          imagePullPolicy: IfNotPresent
          env:
            - name: BGG_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bggapp-secret
                  key: BGG_DB_PASSWORD
            - name: BGG_DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: bggapp-config
                  key: BGG_DB_HOST
            - name: BGG_DB_USER
              valueFrom:
                configMapKeyRef:
                  name: bggapp-config
                  key: BGG_DB_USER
            - name: BGG_PORT
              valueFrom:
                configMapKeyRef:
                  name: bggapp-config
                  key: BGG_PORT
          ports:
            - containerPort: 5000
          resources:
            requests:
              memory: "96Mi"
              cpu: "64m"
            limits:
              memory: "96Mi"
              cpu: "64m"
          livenessProbe:
            initialDelaySeconds: 15
            periodSeconds: 60
            timeoutSeconds: 5
            httpGet:
              path: /healthz
              port: 5000

---
apiVersion: v1
kind: Service
metadata:
  name: bggapp-svc
  namespace: bggns
spec:
  selector:
    name: bggapp-po
  ports:
    - port: 5000
      targetPort: 5000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bggapp-ing
  namespace: bggns
spec:
  ingressClassName: nginx
  rules:
    - host: bgg.139.59.195.104.sslip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bggapp-svc
                port:
                  number: 5000

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: bggapp-hpa
  namespace: bggns
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: bggapp-deploy
  minReplicas: 1
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
