version: "3"

volumes:
  data:

networks:
  mynet:

services:
  mydb:
    image: stackupiss/northwind-db:v1
    environment:
      - MYSQL_ROOT_PASSWORD=changeit
    networks:
      - mynet
    ports:
      - 3306
    volumes:
      - data:/var/lib/mysql

  myapp:
    image: stackupiss/northwind-app:v1
    environment:
      - DB_HOST=mydb
      - DB_USER=root
      - DB_PASSWORD=changeit
    ports:
      - 8080:3000
    networks:
      - mynet
    depends_on:
      - mydb
